function fmt(n){return(n<0?"-":"+")+"\$"+Math.abs(n).toLocaleString("es-AR");}
function fmtAbs(n){return"\$"+Math.abs(n).toLocaleString("es-AR");}
function todayStr(){return new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"short"});}

  const p={stroke:color,strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round",fill:"none"};
  const icons={
    home:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    chart:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
    piggy:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M19 9c0-3.31-3.13-6-7-6S5 5.69 5 9c0 .34.03.67.08 1H4a2 2 0 00-2 2v2a2 2 0 002 2h1.08A7 7 0 0012 20a7 7 0 006.92-4H20a2 2 0 002-2v-2a2 2 0 00-2-2h-1.08C18.97 9.67 19 9.34 19 9z"/></svg>,
    bell:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>,
    sparkle:<svg width={size} height={size} viewBox="0 0 24 24" fill={color}><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>,
    plus:<svg width={size} height={size} viewBox="0 0 24 24" {...p} strokeWidth="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    send:<svg width={size} height={size} viewBox="0 0 24 24" {...p} strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill={color}/></svg>,
    close:<svg width={size} height={size} viewBox="0 0 24 24" {...p} strokeWidth="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    trash:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>,
    check:<svg width={size} height={size} viewBox="0 0 24 24" {...p} strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>,
    arrow:<svg width={size} height={size} viewBox="0 0 24 24" {...p} strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
    food:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>,
    car:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>,
    wallet:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01M2 10h20"/></svg>,
    tag:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>,
    logout:<svg width={size} height={size} viewBox="0 0 24 24" {...p}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
  };
  return icons[name]||null;
}

const catIcons={food:"food",income:"wallet",car:"car",leisure:"tag",home:"home",other:"wallet"};

// ── LOGIN SCREEN ──
function LoginScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [msg,setMsg]=useState("");

  async function handleSubmit(){
    if(!email.trim()||!pass.trim()){setError("Completá todos los campos");return;}
    setLoading(true);setError("");
    try{
      if(mode==="login"){
        const {data,error:e}=await sb.auth.signInWithPassword({email,password:pass});
        if(e)setError("Email o contraseña incorrectos");
        else onLogin(data.user);
      } else {
        const {error:e}=await sb.auth.signUp({email,password:pass});
        if(e)setError(e.message);
        else setMsg("¡Cuenta creada! Revisá tu email para confirmar.");
      }
    }catch{setError("Error de conexión");}
    setLoading(false);
  }

  return <div style={{minHeight:"100vh",background:C.dark,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",maxWidth:390,margin:"0 auto"}}>
    <div style={{marginBottom:40}}><Logo size="lg" dark={true}/></div>
    <div style={{background:"white",borderRadius:24,padding:28,width:"100%"}}>
      <div style={{display:"flex",background:C.bg,borderRadius:14,padding:4,marginBottom:24}}>
        {["login","register"].map(m=><div key={m} onClick={()=>{setMode(m);setError("");setMsg("");}} style={{flex:1,textAlign:"center",padding:"10px",borderRadius:10,background:mode===m?C.dark:"transparent",color:mode===m?"white":C.muted,fontSize:14,fontWeight:700,cursor:"pointer"}}>
          {m==="login"?"Ingresar":"Registrarse"}
        </div>)}
      </div>
      {msg&&<div style={{background:"#d4edda",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#155724"}}>{msg}</div>}
      {error&&<div style={{background:"#f8d7da",borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,color:"#721c24"}}>{error}</div>}
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" type="email" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:14,padding:"13px 16px",fontSize:15,marginBottom:12,outline:"none",color:C.dark}}/>
      <input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()} placeholder="Contraseña" type="password" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:14,padding:"13px 16px",fontSize:15,marginBottom:20,outline:"none",color:C.dark}}/>
      <button onClick={handleSubmit} disabled={loading} style={{width:"100%",background:C.dark,border:"none",borderRadius:16,padding:"15px",fontSize:15,fontWeight:700,color:"white",cursor:"pointer",opacity:loading?0.7:1}}>
        {loading?"Cargando...":(mode==="login"?"Ingresar":"Crear cuenta")}
      </button>
    </div>
  </div>;
}

// ── MAIN APP ──
function MainApp({user,onLogout}){
  const [data,setData]=useState(defaultData);
  const [tab,setTab]=useState("home");
  const [aiInput,setAiInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState(null);
  const [showTx,setShowTx]=useState(false);
  const [showAlert,setShowAlert]=useState(false);
  const [showReset,setShowReset]=useState(false);
  const [txType,setTxType]=useState("gasto");
  const [newTx,setNewTx]=useState({name:"",amount:"",cat:"food"});
  const [newAl,setNewAl]=useState({title:"",desc:"",day:""});
  const endRef=useRef(null);
  const saveTimer=useRef(null);

  useEffect(()=>{loadUserData();},[user]);
  useEffect(()=>{if(tab==="sparkle")endRef.current?.scrollIntoView({behavior:"smooth"});},[data.aiMessages,tab]);

  async function loadUserData(){
    const {data:rows}=await sb.from("user_data").select("data").eq("user_id",user.id).single();
    if(rows?.data)setData({...defaultData,...rows.data});
  }

  async function saveUserData(d){
    setSaving(true);
    await sb.from("user_data").upsert({user_id:user.id,data:d,updated_at:new Date().toISOString()},{onConflict:"user_id"});
    setSaving(false);
  }

  function updateData(fn){
    setData(d=>{
      const next=fn(d);
      clearTimeout(saveTimer.current);
      saveTimer.current=setTimeout(()=>saveUserData(next),1000);
      return next;
    });
  }

  function showToast(m){setToast(m);setTimeout(()=>setToast(null),2800);}

  async function handleLogout(){
    await sb.auth.signOut();
    onLogout();
  }

  function resetAll(){
    const fresh=defaultData;
    setData(fresh);
    saveUserData(fresh);
    setShowReset(false);
    showToast("✅ Datos reseteados");
  }

  function addTx(){
    if(!newTx.name.trim()||!newTx.amount)return;
    const amount=txType==="gasto"?-Math.abs(parseFloat(newTx.amount)):Math.abs(parseFloat(newTx.amount));
    const cat=txType==="ingreso"?"income":newTx.cat;
    const tx={id:Date.now(),name:newTx.name,amount,cat,date:todayStr()};
    updateData(d=>({...d,transactions:[tx,...d.transactions],balance:d.balance+amount,
      expenses:amount<0?d.expenses+Math.abs(amount):d.expenses,
      income:amount>0?d.income+amount:d.income}));
    setNewTx({name:"",amount:"",cat:"food"});setShowTx(false);
    showToast(amount<0?`💸 Gasto: ${fmtAbs(amount)}`:`💰 Ingreso: ${fmtAbs(amount)}`);
  }

  function applyAction(a){
    if(a.action==="add_transaction"){
      const tx={id:Date.now(),name:a.name,amount:a.amount,cat:a.cat||"other",date:todayStr()};
      updateData(d=>({...d,transactions:[tx,...d.transactions],balance:d.balance+a.amount,
        expenses:a.amount<0?d.expenses+Math.abs(a.amount):d.expenses,
        income:a.amount>0?d.income+a.amount:d.income}));
      showToast(a.amount<0?`💸 ${fmtAbs(a.amount)}`:`💰 ${fmtAbs(a.amount)}`);
    }
    if(a.action==="add_saving")updateData(d=>({...d,savings:d.savings.map(s=>s.id===a.id?{...s,current:s.current+a.amount}:s)}));
    if(a.action==="add_alert")updateData(d=>({...d,alerts:[...d.alerts,{id:Date.now(),title:a.title,desc:a.desc||"",day:a.day||"—",active:true,color:"#3498DB"}]}));
  }

  async function sendMsg(text){
    const msg=text||aiInput;if(!msg.trim())return;
    setAiInput("");
    const msgs=[...data.aiMessages,{role:"user",text:msg}];
    updateData(d=>({...d,aiMessages:msgs}));setLoading(true);
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile",max_tokens:1000,
          messages:[
            {role:"system",content:`Sos el asistente de Cuentas Claras, app de finanzas argentina. Español rioplatense, conciso (máx 3 oraciones), emojis ocasionales.
DATOS: Balance $${data.balance.toLocaleString("es-AR")} | Gastos $${data.expenses.toLocaleString("es-AR")} | Ingresos $${data.income.toLocaleString("es-AR")}
Ahorros: ${JSON.stringify(data.savings)}
ACCIONES (JSON al final si hay acción):
{"action":"add_transaction","name":"x","amount":-100,"cat":"food|car|leisure|home|income|other"}
{"action":"add_saving","id":1,"amount":5000}
{"action":"add_alert","title":"x","desc":"x","day":"x"}`},
            ...msgs.map(m=>({role:m.role==="ai"?"assistant":"user",content:m.text}))
          ]
        })
      });
      const json=await res.json();
      const full=json.choices?.[0]?.message?.content||"No pude procesar eso.";
      const match=full.match(/\{[\s\S]*?"action"[\s\S]*?\}/);
      const display=full.replace(/\{[\s\S]*?"action"[\s\S]*?\}/,"").trim();
      if(match){try{applyAction(JSON.parse(match[0]));}catch{}}
      updateData(d=>({...d,aiMessages:[...d.aiMessages,{role:"ai",text:display}]}));
    }catch{updateData(d=>({...d,aiMessages:[...d.aiMessages,{role:"ai",text:"Error de conexión. Intentá de nuevo."}]}));}
    setLoading(false);
  }

  const gastosReales=data.transactions.filter(t=>t.amount<0);
  const totalGastos=gastosReales.reduce((s,t)=>s+Math.abs(t.amount),0);
  const catTotals={food:0,car:0,home:0,leisure:0,other:0};
  gastosReales.forEach(t=>{if(catTotals[t.cat]!==undefined)catTotals[t.cat]+=Math.abs(t.amount);else catTotals.other+=Math.abs(t.amount);});
  const catBars=totalGastos===0?[]:[
    {name:"Comida",pct:Math.round(catTotals.food/totalGastos*100),color:"#F4A261",total:catTotals.food},
    {name:"Transporte",pct:Math.round(catTotals.car/totalGastos*100),color:"#3498DB",total:catTotals.car},
    {name:"Hogar",pct:Math.round(catTotals.home/totalGastos*100),color:"#E74C3C",total:catTotals.home},
    {name:"Ocio",pct:Math.round(catTotals.leisure/totalGastos*100),color:"#9B59B6",total:catTotals.leisure},
    {name:"Otro",pct:Math.round(catTotals.other/totalGastos*100),color:"#95A5A6",total:catTotals.other},
  ].filter(b=>b.pct>0).sort((a,b)=>b.pct-a.pct);

  return <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:C.bg,minHeight:"100vh",maxWidth:390,margin:"0 auto",display:"flex",flexDirection:"column",position:"relative"}}>

    <div style={{background:C.dark,padding:"10px 20px 6px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{color:"white",fontSize:12,fontWeight:600}}>9:41</span>
      <span style={{color:"rgba(255,255,255,0.4)",fontSize:10}}>{saving?"guardando...":user.email}</span>
    </div>

    {toast&&<div style={{position:"fixed",top:60,left:"50%",transform:"translateX(-50%)",background:C.dark,color:"white",borderRadius:24,padding:"10px 20px",fontSize:13,fontWeight:600,zIndex:999,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",whiteSpace:"nowrap",animation:"fadeIn .3s ease"}}>{toast}</div>}

    {showReset&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:990,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 24px"}}>
      <div style={{background:"white",borderRadius:24,padding:28,width:"100%",maxWidth:340}}>
        <div style={{fontSize:18,fontWeight:800,color:C.dark,marginBottom:8}}>¿Resetear todo?</div>
        <div style={{fontSize:14,color:C.muted,marginBottom:24}}>Se van a borrar todos tus datos y vas a empezar desde cero.</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setShowReset(false)} style={{flex:1,background:C.bg,border:"none",borderRadius:14,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer",color:C.muted}}>Cancelar</button>
          <button onClick={resetAll} style={{flex:1,background:C.red,border:"none",borderRadius:14,padding:"13px",fontSize:14,fontWeight:700,cursor:"pointer",color:"white"}}>Borrar todo</button>
        </div>
      </div>
    </div>}

    {showTx&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:900,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"white",borderRadius:"24px 24px 0 0",padding:"28px 24px 40px",width:"100%",maxWidth:390}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div style={{fontSize:18,fontWeight:800,color:C.dark}}>Nuevo movimiento</div>
          <div onClick={()=>setShowTx(false)} style={{cursor:"pointer"}}><Icon name="close" size={20} color={C.muted}/></div>
        </div>
        <div style={{display:"flex",background:C.bg,borderRadius:14,padding:4,marginBottom:20}}>
          {["gasto","ingreso"].map(t=><div key={t} onClick={()=>setTxType(t)} style={{flex:1,textAlign:"center",padding:"10px",borderRadius:10,background:txType===t?C.dark:"transparent",color:txType===t?"white":C.muted,fontSize:14,fontWeight:700,cursor:"pointer"}}>
            {t==="gasto"?"💸 Gasto":"💰 Ingreso"}
          </div>)}
        </div>
        <input value={newTx.name} onChange={e=>setNewTx(n=>({...n,name:e.target.value}))} placeholder="Descripción (ej: Supermercado)" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:14,padding:"13px 16px",fontSize:15,marginBottom:12,outline:"none",color:C.dark}}/>
        <input value={newTx.amount} onChange={e=>setNewTx(n=>({...n,amount:e.target.value}))} placeholder="Monto en $" type="number" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:14,padding:"13px 16px",fontSize:15,marginBottom:12,outline:"none",color:C.dark}}/>
        {txType==="gasto"&&<div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
          {Object.entries(catLabels).filter(([k])=>k!=="income").map(([k,v])=><div key={k} onClick={()=>setNewTx(n=>({...n,cat:k}))} style={{padding:"7px 14px",borderRadius:20,background:newTx.cat===k?C.dark:C.bg,color:newTx.cat===k?"white":C.muted,fontSize:12,fontWeight:600,cursor:"pointer",border:`1.5px solid ${newTx.cat===k?C.dark:C.border}`}}>{v}</div>)}
        </div>}
        <button onClick={addTx} style={{width:"100%",background:txType==="gasto"?C.dark:C.green,border:"none",borderRadius:16,padding:"15px",fontSize:15,fontWeight:700,color:"white",cursor:"pointer"}}>
          {txType==="gasto"?"Registrar gasto":"Registrar ingreso"}
        </button>
      </div>
    </div>}

    <div style={{flex:1,overflowY:"auto",paddingBottom:80}}>

      {tab==="home"&&<div>
        <div style={{background:C.dark,padding:"24px 24px 36px",position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:-50,right:-50,width:180,height:180,borderRadius:"50%",background:"rgba(255,255,255,0.03)"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <Logo size="md" dark={true}/>
            <div style={{display:"flex",gap:8}}>
              <div onClick={()=>setShowReset(true)} style={{background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:11,color:"rgba(255,255,255,0.6)",fontWeight:600}}>🗑️</div>
              <div onClick={handleLogout} style={{background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:11,color:"rgba(255,255,255,0.6)",fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
                <Icon name="logout" size={14} color="rgba(255,255,255,0.6)"/>
              </div>
            </div>
          </div>
          <div style={{marginTop:28,marginBottom:6,color:"rgba(255,255,255,0.5)",fontSize:12}}>Balance disponible</div>
          <div style={{color:"white",fontSize:40,fontWeight:800,letterSpacing:-2,marginBottom:24}}>${data.balance.toLocaleString("es-AR")}</div>
          <div style={{display:"flex",gap:12}}>
            <div style={{flex:1,background:"rgba(255,255,255,0.07)",borderRadius:14,padding:"12px 14px"}}>
              <div style={{color:"rgba(255,255,255,0.45)",fontSize:10,letterSpacing:1,marginBottom:5}}>INGRESOS</div>
              <div style={{color:C.green,fontSize:17,fontWeight:700}}>${data.income.toLocaleString("es-AR")}</div>
            </div>
            <div style={{flex:1,background:"rgba(255,255,255,0.07)",borderRadius:14,padding:"12px 14px"}}>
              <div style={{color:"rgba(255,255,255,0.45)",fontSize:10,letterSpacing:1,marginBottom:5}}>GASTOS</div>
              <div style={{color:C.red,fontSize:17,fontWeight:700}}>${data.expenses.toLocaleString("es-AR")}</div>
            </div>
          </div>
        </div>
        <div style={{padding:"16px 20px 0"}}>
          <div onClick={()=>setTab("sparkle")} style={{background:"linear-gradient(135deg,#1A1A2E,#2d3a8c)",borderRadius:16,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
            <div style={{background:"rgba(255,255,255,0.1)",borderRadius:10,padding:8}}><Icon name="sparkle" size={16} color={C.gold}/></div>
            <div style={{flex:1}}>
              <div style={{color:"white",fontSize:13,fontWeight:600}}>Asistente IA activo</div>
              <div style={{color:"rgba(255,255,255,0.45)",fontSize:11}}>Registrá gastos con lenguaje natural</div>
            </div>
            <Icon name="arrow" size={16} color="rgba(255,255,255,0.3)"/>
          </div>
        </div>
        <div style={{padding:"20px 20px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:15,fontWeight:700,color:C.dark}}>Últimos movimientos</div>
            <div onClick={()=>setShowTx(true)} style={{display:"flex",alignItems:"center",gap:4,background:C.dark,borderRadius:20,padding:"6px 14px",cursor:"pointer"}}>
              <Icon name="plus" size={12} color="white"/>
              <span style={{fontSize:12,color:"white",fontWeight:600}}>Agregar</span>
            </div>
          </div>
          {data.transactions.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:14}}>No hay movimientos aún.<br/>¡Agregá tu primer gasto o ingreso!</div>}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {data.transactions.slice(0,10).map(e=><div key={e.id} style={{background:"white",borderRadius:14,padding:"13px 16px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}}>
              <div style={{width:38,height:38,borderRadius:12,background:(catColors[e.cat]||"#aaa")+"18",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name={catIcons[e.cat]||"wallet"} size={18} color={catColors[e.cat]||"#aaa"}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:C.dark}}>{e.name}</div>
                <div style={{fontSize:11,color:C.muted}}>{e.date}</div>
              </div>
              <div style={{fontSize:15,fontWeight:700,color:e.amount>0?C.green:C.dark}}>{fmt(e.amount)}</div>
            </div>)}
          </div>
        </div>
      </div>}

      {tab==="chart"&&<div style={{padding:"24px 20px"}}>
        <div style={{fontSize:22,fontWeight:800,color:C.dark,marginBottom:4}}>Análisis</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:24}}>{new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"})}</div>
        <div style={{background:"white",borderRadius:20,padding:20,marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:12,color:C.muted,letterSpacing:1,marginBottom:18}}>GASTOS POR CATEGORÍA</div>
          {catBars.length===0&&<div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:14}}>Todavía no hay gastos registrados 📊</div>}
          {catBars.map(b=><div key={b.name} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:13,fontWeight:600,color:C.dark}}>{b.name}</span>
              <span style={{fontSize:13,color:C.muted}}>{b.pct}% · {fmtAbs(b.total)}</span>
            </div>
            <div style={{height:7,background:"#F0F0F0",borderRadius:99}}>
              <div style={{height:"100%",width:`${b.pct}%`,background:b.color,borderRadius:99}}/>
            </div>
          </div>)}
        </div>
      </div>}

      {tab==="sparkle"&&<div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 160px)"}}>
        <div style={{background:C.dark,padding:"20px 20px 16px",display:"flex",alignItems:"center",gap:12}}>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:12,padding:10}}><Icon name="sparkle" size={18} color={C.gold}/></div>
          <div>
            <div style={{color:"white",fontSize:15,fontWeight:700}}>Asistente IA</div>
            <div style={{color:"rgba(255,255,255,0.4)",fontSize:11}}>Cuentas Claras · datos en la nube ☁️</div>
          </div>
        </div>
        <div style={{padding:"12px 16px 0",display:"flex",gap:8,overflowX:"auto"}}>
          {aiSuggestions.map((s,i)=><div key={i} onClick={()=>sendMsg(s)} style={{background:"white",border:`1px solid ${C.border}`,borderRadius:20,padding:"7px 14px",fontSize:12,color:C.dark,whiteSpace:"nowrap",cursor:"pointer",flexShrink:0}}>{s}</div>)}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px 16px 0"}}>
          {data.aiMessages.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:12}}>
            <div style={{maxWidth:"78%",background:m.role==="user"?C.dark:"white",color:m.role==="user"?"white":C.dark,borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",padding:"12px 16px",fontSize:14,lineHeight:1.5,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>{m.text}</div>
          </div>)}
          {loading&&<div style={{display:"flex",gap:5,padding:"8px 4px"}}><div className="dot"/><div className="dot"/><div className="dot"/></div>}
          <div ref={endRef}/>
        </div>
        <div style={{padding:"12px 16px 16px",background:C.bg,display:"flex",gap:10}}>
          <input value={aiInput} onChange={e=>setAiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendMsg()} placeholder="Escribí tu consulta o gasto..." style={{flex:1,background:"white",border:`1.5px solid ${C.border}`,borderRadius:24,padding:"12px 18px",fontSize:14,color:C.dark,outline:"none"}}/>
          <button onClick={()=>sendMsg()} style={{width:46,height:46,borderRadius:"50%",background:C.dark,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name="send" size={17} color="white"/>
          </button>
        </div>
      </div>}

      {tab==="bell"&&<div style={{padding:"24px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
          <div>
            <div style={{fontSize:22,fontWeight:800,color:C.dark,marginBottom:4}}>Alertas</div>
            <div style={{fontSize:13,color:C.muted}}>{data.alerts.filter(a=>a.active).length} activas</div>
          </div>
          <button onClick={()=>setShowAlert(v=>!v)} style={{background:C.dark,border:"none",borderRadius:14,padding:"10px 16px",display:"flex",alignItems:"center",gap:6,cursor:"pointer",color:"white",fontSize:13,fontWeight:600}}>
            <Icon name="plus" size={14} color="white"/> Nueva
          </button>
        </div>
        {showAlert&&<div style={{background:"white",borderRadius:20,padding:20,marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,0.07)"}}>
          <input value={newAl.title} onChange={e=>setNewAl(n=>({...n,title:e.target.value}))} placeholder="Título" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:12,padding:"11px 14px",fontSize:14,marginBottom:10,outline:"none"}}/>
          <input value={newAl.desc} onChange={e=>setNewAl(n=>({...n,desc:e.target.value}))} placeholder="Descripción (opcional)" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:12,padding:"11px 14px",fontSize:14,marginBottom:10,outline:"none"}}/>
          <input value={newAl.day} onChange={e=>setNewAl(n=>({...n,day:e.target.value}))} placeholder="Día (ej: 5, Lunes)" style={{width:"100%",border:`1.5px solid ${C.border}`,borderRadius:12,padding:"11px 14px",fontSize:14,marginBottom:14,outline:"none"}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setShowAlert(false)} style={{flex:1,background:C.bg,border:"none",borderRadius:12,padding:"11px",fontSize:14,cursor:"pointer",fontWeight:600,color:C.muted}}>Cancelar</button>
            <button onClick={()=>{if(!newAl.title.trim())return;updateData(d=>({...d,alerts:[...d.alerts,{id:Date.now(),...newAl,active:true,color:"#3498DB"}]}));setNewAl({title:"",desc:"",day:""});setShowAlert(false);showToast("🔔 Alerta creada");}} style={{flex:1,background:C.dark,border:"none",borderRadius:12,padding:"11px",fontSize:14,cursor:"pointer",fontWeight:600,color:"white"}}>Guardar</button>
          </div>
        </div>}
        {data.alerts.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:14}}>No hay alertas aún.<br/>¡Creá tu primer recordatorio!</div>}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {data.alerts.map(a=><div key={a.id} style={{background:"white",borderRadius:18,padding:16,display:"flex",alignItems:"center",gap:14,boxShadow:"0 1px 6px rgba(0,0,0,0.05)",opacity:a.active?1:0.5}}>
            <div style={{width:42,height:42,borderRadius:14,background:a.color+"18",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="bell" size={18} color={a.color}/></div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:C.dark}}>{a.title}</div>
              {a.desc&&<div style={{fontSize:12,color:C.muted}}>{a.desc}</div>}
              {a.day&&<div style={{fontSize:11,color:a.color,fontWeight:600,marginTop:3}}>📅 Día {a.day}</div>}
            </div>
            <div style={{display:"flex",gap:8}}>
              <div onClick={()=>updateData(d=>({...d,alerts:d.alerts.map(al=>al.id===a.id?{...al,active:!al.active}:al)}))} style={{width:32,height:32,borderRadius:10,background:a.active?C.green+"18":"#F0F0F0",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Icon name="check" size={14} color={a.active?C.green:C.muted}/></div>
              <div onClick={()=>{updateData(d=>({...d,alerts:d.alerts.filter(al=>al.id!==a.id)}));showToast("Alerta eliminada");}} style={{width:32,height:32,borderRadius:10,background:C.red+"10",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Icon name="trash" size={14} color={C.red}/></div>
            </div>
          </div>)}
        </div>
      </div>}

      {tab==="piggy"&&<div style={{padding:"24px 20px"}}>
        <div style={{fontSize:22,fontWeight:800,color:C.dark,marginBottom:4}}>Mis ahorros</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:24}}>{data.savings.length} metas activas</div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {data.savings.map(s=>{
            const pct=Math.min(100,Math.round((s.current/s.goal)*100));
            return <div key={s.id} style={{background:"white",borderRadius:20,padding:20,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:C.dark}}>{s.name}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>${s.current.toLocaleString("es-AR")} de ${s.goal.toLocaleString("es-AR")}</div>
                </div>
                <div style={{background:s.color+"18",color:s.color,borderRadius:20,padding:"4px 12px",fontSize:13,fontWeight:700}}>{pct}%</div>
              </div>
              <div style={{height:8,background:"#F0F0F0",borderRadius:99}}>
                <div style={{height:"100%",width:`${pct}%`,background:s.color,borderRadius:99}}/>
              </div>
              {pct>=90&&<div style={{fontSize:11,color:s.color,marginTop:8,fontWeight:600}}>🎉 ¡Casi llegás a tu meta!</div>}
            </div>;
          })}
        </div>
      </div>}

    </div>

    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:390,background:"white",borderTop:`1px solid ${C.border}`,display:"flex",padding:"10px 0 16px",boxShadow:"0 -4px 20px rgba(0,0,0,0.05)"}}>
      {tabs.map(t=><div key={t} onClick={()=>setTab(t)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer"}}>
        <div style={{width:40,height:40,borderRadius:14,background:tab===t?C.dark:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"background .2s"}}>
          <Icon name={t} size={20} color={tab===t?"white":C.muted}/>
        </div>
        <div style={{fontSize:10,fontWeight:tab===t?700:400,color:tab===t?C.dark:C.muted,letterSpacing:0.3}}>{tabLabels[t]}</div>
      </div>)}
    </div>
  </div>;
}

// ── ROOT ──
function App(){
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);
      setChecking(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user||null);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  if(checking)return <div style={{minHeight:"100vh",background:C.dark,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{color:"white",fontSize:16,fontWeight:600}}>Cargando...</div>
  </div>;

  if(!user)return <LoginScreen onLogin={setUser}/>;
  return <MainApp user={user} onLogout={()=>setUser(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
